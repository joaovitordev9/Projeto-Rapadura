<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Login | Produtos Delicias da Roca</title>
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --marrom: #5c3317;
            --marrom2: #8b4513;
            --creme: #f8f5ef;
            --verde: #25d366
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(rgba(0, 0, 0, .55), rgba(0, 0, 0, .55)), url("image/fotoPrincipalRapadura.png");
            background-size: cover;
            background-position: center;
            padding: 20px
        }

        .box {
            width: 100%;
            max-width: 420px;
            background: rgba(255, 255, 255, .12);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, .15);
            padding: 45px;
            border-radius: 28px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, .35);
            color: white
        }

        .logo {
            text-align: center;
            margin-bottom: 10px;
            font-family: 'Playfair Display', serif;
            font-size: 18px;
            font-weight: 800;
            color: #ffcf87
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            font-size: 34px
        }

        .sub {
            text-align: center;
            color: #eee;
            margin-bottom: 30px;
            line-height: 1.6;
            font-size: 15px
        }

        .input-group {
            margin-bottom: 18px
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #f1f1f1
        }

        input {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 14px;
            background: rgba(255, 255, 255, .12);
            color: white;
            font-size: 15px;
            outline: none;
            border: 1px solid rgba(255, 255, 255, .15);
            transition: .3s
        }

        input::placeholder {
            color: #ddd
        }

        input:focus {
            border-color: #ffcf87;
            background: rgba(255, 255, 255, .16)
        }

        button {
            width: 100%;
            border: none;
            padding: 16px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: .3s
        }

        .login {
            background: linear-gradient(135deg, #5c3317, #8b4513);
            color: white;
            margin-top: 10px
        }

        .login:hover {
            transform: translateY(-3px)
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 22px;
            color: #ffcf87;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px
        }

        .mensagem {
            position: fixed;
            top: 25px;
            right: 25px;
            padding: 16px 22px;
            border-radius: 16px;
            color: white;
            font-weight: 600;
            font-size: 15px;
            z-index: 99999;
            box-shadow: 0 15px 35px rgba(0, 0, 0, .25);
            animation: slideIn .4s ease;
            backdrop-filter: blur(10px)
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(40px)
            }
            to {
                opacity: 1;
                transform: translateX(0)
            }
        }

        @media (max-width: 500px) {
            .box {
                padding: 35px 25px
            }

            h1 {
                font-size: 28px
            }
        }
    </style>
</head>
<body>
<div class="box">
    <div class="logo">Produtos Delicias da Roca</div>
    <h1>Entrar como Admin</h1>
    <p class="sub">Use o usuario e a senha cadastrados no arquivo admin.json.</p>
    <div class="input-group"><label>Usuario</label><input autocomplete="username" id="usuario" placeholder="Digite seu usuario"
                                                          type="text"></div>
    <div class="input-group"><label>Senha</label><input autocomplete="current-password" id="senha" placeholder="Digite sua senha"
                                                        type="password"></div>
    <button class="login" onclick="login()">Entrar</button>
    <a class="back" href="index.html">Voltar para o site</a>
</div>
<script>
    let csrfToken = null;

    async function carregarCsrf() {
        if (csrfToken) {
            return csrfToken;
        }
        const resposta = await fetch('/csrf');
        csrfToken = await resposta.json();
        return csrfToken;
    }

    async function fetchComCsrf(url, options = {}) {
        const token = await carregarCsrf();
        return fetch(url, {...options, headers: {...(options.headers || {}), [token.headerName]: token.token}});
    }

    function mostrarMensagem(texto, cor) {
        const msg = document.createElement('div');
        msg.classList.add('mensagem');
        msg.style.background = cor;
        msg.innerText = texto;
        document.body.appendChild(msg);
        setTimeout(() => msg.remove(), 2500);
    }

    async function login() {
        const usuario = document.getElementById('usuario').value.trim();
        const senha = document.getElementById('senha').value;
        if (!usuario || !senha) {
            mostrarMensagem('Preencha todos os campos.', '#ff4d4d');
            return;
        }
        const resposta = await fetchComCsrf('/login', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({usuario, senha})
        });
        if (resposta.ok) {
            window.location.href = 'admin.html';
            return;
        }
        mostrarMensagem('Usuario ou senha invalidos.', '#ff4d4d');
    }
</script>
</body>
</html>

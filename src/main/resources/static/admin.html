<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Admin | Produtos Delicias da Roca</title>
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --marrom: #5c3317;
            --marrom2: #8b4513;
            --verde: #25d366
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(rgba(0, 0, 0, .6), rgba(0, 0, 0, .6)), url("image/fotoPrincipalRapadura.png");
            background-size: cover;
            background-position: center
        }

        .box {
            width: 100%;
            max-width: 520px;
            background: rgba(255, 255, 255, .12);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, .15);
            border-radius: 30px;
            padding: 45px;
            color: white;
            box-shadow: 0 20px 50px rgba(0, 0, 0, .35);
            animation: fadeUp .7s ease
        }

        .logo {
            text-align: center;
            font-family: 'Playfair Display', serif;
            font-size: 20px;
            font-weight: 800;
            color: #ffcf87;
            margin-bottom: 10px
        }

        h1 {
            text-align: center;
            font-size: 34px;
            margin-bottom: 10px
        }

        .sub {
            text-align: center;
            color: #eee;
            line-height: 1.6;
            margin-bottom: 30px;
            font-size: 15px
        }

        .input-group {
            margin-bottom: 18px
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #f1f1f1;
            font-size: 14px
        }

        input, textarea {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 14px;
            background: rgba(255, 255, 255, .12);
            color: white;
            font-size: 15px;
            outline: none;
            border: 1px solid rgba(255, 255, 255, .15);
            transition: .3s;
            font-family: 'Poppins', sans-serif
        }

        textarea {
            min-height: 130px;
            resize: none
        }

        input::placeholder, textarea::placeholder {
            color: #ddd
        }

        input:focus, textarea:focus {
            border-color: #ffcf87;
            background: rgba(255, 255, 255, .16)
        }

        button {
            width: 100%;
            border: none;
            padding: 16px;
            border-radius: 14px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: .3s;
            margin-top: 10px;
            background: linear-gradient(135deg, #5c3317, #8b4513);
            color: white;
            box-shadow: 0 10px 25px rgba(0, 0, 0, .25)
        }

        button:hover {
            transform: translateY(-3px)
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 22px;
            color: #ffcf87;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px
        }

        .preview {
            width: 100%;
            height: 220px;
            margin-top: 18px;
            border-radius: 18px;
            object-fit: cover;
            display: none;
            border: 2px solid rgba(255, 255, 255, .15)
        }

        .mensagem {
            position: fixed;
            top: 25px;
            right: 25px;
            background: #25d366;
            color: white;
            padding: 16px 22px;
            border-radius: 16px;
            font-weight: 600;
            box-shadow: 0 15px 35px rgba(0, 0, 0, .25);
            z-index: 99999;
            animation: slideIn .4s ease
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(30px)
            }
            to {
                opacity: 1;
                transform: translateY(0)
            }
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(40px)
            }
            to {
                opacity: 1;
                transform: translateX(0)
            }
        }

        @media (max-width: 550px) {
            .box {
                padding: 35px 25px
            }

            h1 {
                font-size: 28px
            }
        }
    </style>
</head>
<body>
<div class="box">
    <div class="logo">Produtos Delicias da Roca</div>
    <h1>Adicionar Sabor</h1>
    <p class="sub">Adicione novos sabores artesanais ao catalogo da loja.</p>
    <div class="input-group"><label>Nome do Sabor</label><input id="nome" placeholder="Digite o nome do produto"></div>
    <div class="input-group"><label>Descricao</label><textarea id="descricao"
                                                               placeholder="Digite uma descricao"></textarea></div>
    <div class="input-group"><label>URL da Imagem</label><input id="imagem" oninput="previewImagem()"
                                                                placeholder="Cole a URL da imagem"></div>
    <img alt="Preview da imagem" class="preview" id="preview">
    <button onclick="addProduto()">Adicionar Sabor</button>
    <button onclick="logout()">Sair</button>
    <a class="back" href="index.html">Voltar para o site</a>
</div>
<script>
    let csrfToken = null;

    async function carregarCsrf() {
        if (csrfToken) {
            return csrfToken;
        }
        const resposta = await fetch('/csrf');
        csrfToken = await resposta.json();
        return csrfToken;
    }

    async function fetchComCsrf(url, options = {}) {
        const token = await carregarCsrf();
        return fetch(url, {...options, headers: {...(options.headers || {}), [token.headerName]: token.token}});
    }

    async function verificarAcesso() {
        const resposta = await fetch('/admin/status');
        const status = await resposta.json();
        if (!status.admin) {
            window.location.href = 'login.html';
        }
    }

    function previewImagem() {
        const url = document.getElementById('imagem').value;
        const preview = document.getElementById('preview');
        if (url) {
            preview.src = url;
            preview.style.display = 'block';
        } else {
            preview.style.display = 'none';
        }
    }

    function mostrarMensagem(texto, cor) {
        const msg = document.createElement('div');
        msg.classList.add('mensagem');
        msg.style.background = cor;
        msg.innerText = texto;
        document.body.appendChild(msg);
        setTimeout(() => msg.remove(), 2500);
    }

    async function addProduto() {
        const nome = document.getElementById('nome').value.trim();
        const descricao = document.getElementById('descricao').value.trim();
        const imagem = document.getElementById('imagem').value.trim();
        if (!nome || !descricao || !imagem) {
            mostrarMensagem('Preencha todos os campos!', '#ff4d4d');
            return;
        }
        const resposta = await fetchComCsrf('/produtos', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({nome, descricao, imagem})
        });
        if (!resposta.ok) {
            mostrarMensagem('Erro ao salvar produto.', '#ff4d4d');
            return;
        }
        mostrarMensagem('Sabor criado com sucesso!', '#25d366');
        document.getElementById('nome').value = '';
        document.getElementById('descricao').value = '';
        document.getElementById('imagem').value = '';
        document.getElementById('preview').style.display = 'none';
        setTimeout(() => {
            window.location.href = 'index.html';
        }, 1200);
    }

    async function logout() {
        await fetchComCsrf('/logout', {method: 'POST'});
        window.location.href = 'index.html';
    }

    verificarAcesso();
</script>
</body>
</html>
